services:
  - type: web
    name: whereisprof-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: FACE_SERVICE_URL
        sync: false
      - key: FACE_SERVICE_SECRET
        sync: false

  - type: web
    name: whereisprof-face-service
    runtime: docker
    rootDir: face-service
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: FACE_SERVICE_SECRET
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "0.52"
